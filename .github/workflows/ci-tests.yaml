name: Run CI Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Expo 58 / React Native 0.88 require Node ^22.13, ^24.3 or >=26
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      # `npm test` runs jest in watch mode and never exits; test:ci runs once
      - name: Run tests
        run: npm run test:ci
